<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counterfoil — Offline Ticket Design</title>
<style>
:root{
  --ink:#16191f; --ink2:#4a5160; --ink3:#7b8291; --line:#e2e5ea; --bg:#f6f7f9; --card:#fff;
  --blue:#2456d6; --blue-bg:#e9effd;      /* offline verification */
  --violet:#6b3fd1; --violet-bg:#f1ebfd;  /* broadcast */
  --green:#18794e; --green-bg:#e5f4ec;    /* mined / door pass */
  --teal:#0f6d78; --teal-bg:#e2f2f3;      /* wallet import */
  --amber:#9a5300; --amber-bg:#fff3dd;
  --red:#c4322b; --red-bg:#fdeceb;
  --gray:#5b6270; --gray-bg:#eef0f3;
  --radius:10px;
  font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color:var(--ink);
}
*{box-sizing:border-box}
body{margin:0;background:#dfe2e8;display:grid;grid-template-columns:270px 1fr;height:100vh;overflow:hidden}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}

/* ---------- design canvas chrome ---------- */
#index{background:#14171c;color:#cfd3da;overflow:auto;padding:18px 14px 40px}
#index h1{font-size:15px;color:#fff;margin:0 0 4px}
#index p{font-size:12px;color:#8e95a3;margin:0 0 14px;line-height:1.45}
#index h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7d8594;margin:18px 0 6px}
#index a{display:block;color:#cfd3da;text-decoration:none;font-size:13px;padding:5px 8px;border-radius:6px}
#index a:hover{background:#232830}
#index a.on{background:#2f5bd8;color:#fff}
#index a small{color:#7d8594;margin-right:6px}
#index a.on small{color:#cdd9ff}
#stage{overflow:auto;padding:22px 28px 60px}
#stagebar{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
#stagebar h2{margin:0;font-size:18px}
#stagebar .note{font-size:12.5px;color:#4a5160;flex:1 1 300px}
.seg{display:inline-flex;background:#fff;border-radius:8px;padding:3px;border:1px solid #c9ced8}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;font:inherit;font-size:13px;cursor:pointer;color:#4a5160}
.seg button.on{background:#16191f;color:#fff}
#frames{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.device{display:flex;flex-direction:column;gap:6px}
.device .lbl{font-size:12px;color:#4a5160}
.laptop{width:1040px;height:700px;border:10px solid #1d2026;border-radius:14px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.phone{width:390px;height:800px;border:12px solid #1d2026;border-radius:42px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.phone .screen{border-radius:30px}
.screen{width:100%;height:100%;overflow:auto;container-type:inline-size;background:var(--bg);position:relative}
#frames.only-laptop .device.ph,#frames.only-phone .device.lp{display:none}

/* ---------- app: status strip ---------- */
.strip{position:sticky;top:0;z-index:5;display:flex;align-items:stretch;background:#fff;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink2);min-height:36px}
.strip > div{display:flex;align-items:center;gap:6px;padding:0 12px;border-right:1px solid var(--line);white-space:nowrap}
.strip > div:last-child{border-right:0}
.strip b{color:var(--ink);font-weight:600}
.conn{font-weight:600}
.conn.off{background:#16191f;color:#fff}
.conn.on{background:var(--green-bg);color:var(--green)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.strip .warn{background:var(--amber-bg);color:var(--amber)}
.strip .warn b{color:var(--amber)}
.strip .fill{flex:1}
.strip .sub{color:var(--ink3)}
.strip .zero b{color:var(--blue)}
.strip-compact{display:none}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:184px 1fr;min-height:calc(100% - 37px)}
.rail{background:#fff;border-right:1px solid var(--line);padding:14px 10px;font-size:13px}
.rail .brand{font-weight:700;font-size:13.5px;padding:0 8px 12px}
.rail .brand span{display:block;font-weight:400;font-size:11px;color:var(--ink3)}
.rail a{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:7px;color:var(--ink2);text-decoration:none}
.rail a.on{background:var(--gray-bg);color:var(--ink);font-weight:600}
.rail .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin:14px 8px 4px}
.content{padding:20px 26px 90px;min-width:0}
.head{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.head h1{font-size:21px;margin:0;line-height:1.25}
.head .crumb{font-size:12px;color:var(--ink3);margin-bottom:3px}
.head .grow{flex:1;min-width:200px}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.cols.one{grid-template-columns:1fr}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h3{font-size:14px;margin:0 0 10px}
.card h3 .muted{font-weight:400}
.muted{color:var(--ink3)}
.small{font-size:12.5px}
p{margin:0 0 10px;line-height:1.5;font-size:14px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--ink3)} .kv dd{margin:0;word-break:break-all}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid #c9ced8;background:#fff;color:var(--ink);padding:9px 14px;border-radius:8px;font:inherit;font-size:14px;font-weight:600;cursor:default;display:inline-flex;gap:7px;align-items:center}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--red);border-color:#f0c4c1}
.btn[disabled]{opacity:.42}
.btn.sm{padding:5px 10px;font-size:12.5px}
.disabled-why{font-size:12.5px;color:var(--ink3);margin-top:6px;width:100%}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.b-blue{background:var(--blue-bg);color:var(--blue)} .b-violet{background:var(--violet-bg);color:var(--violet)}
.b-green{background:var(--green-bg);color:var(--green)} .b-teal{background:var(--teal-bg);color:var(--teal)}
.b-amber{background:var(--amber-bg);color:var(--amber)} .b-red{background:var(--red-bg);color:var(--red)}
.b-gray{background:var(--gray-bg);color:var(--gray)} .b-dark{background:#16191f;color:#fff}
.b-outline{border:1px dashed #a3a9b5;color:var(--ink2);background:#fff}
input.f{width:100%;font:inherit;font-size:14px;padding:9px 11px;border:1px solid #c9ced8;border-radius:8px;background:#fff}
label.fl{display:block;font-size:12.5px;font-weight:600;margin:0 0 5px}
.count{float:right;font-weight:400;color:var(--ink3)}
.field{margin-bottom:14px}

/* verdict banner */
.verdict{border-radius:var(--radius);padding:16px 18px;display:flex;gap:14px;align-items:flex-start;border:1px solid transparent}
.verdict .ic{flex:0 0 38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:700;color:#fff}
.verdict h2{margin:0 0 4px;font-size:18px}
.verdict p{margin:0;font-size:13.5px}
.v-blue{background:var(--blue-bg);border-color:#c8d6fa} .v-blue .ic{background:var(--blue)} .v-blue h2{color:var(--blue)}
.v-green{background:var(--green-bg);border-color:#bfe3cf} .v-green .ic{background:var(--green)} .v-green h2{color:var(--green)}
.v-amber{background:var(--amber-bg);border-color:#f3d9a8} .v-amber .ic{background:var(--amber)} .v-amber h2{color:var(--amber)}
.v-red{background:var(--red-bg);border-color:#f3c6c3} .v-red .ic{background:var(--red)} .v-red h2{color:var(--red)}
.v-gray{background:var(--gray-bg);border-color:#d9dde3} .v-gray .ic{background:var(--gray)} .v-gray h2{color:var(--ink)}

/* limits box */
.limits{border-left:3px solid #9aa1ae;background:#fafbfc;padding:10px 12px;border-radius:0 8px 8px 0;font-size:12.5px;color:var(--ink2);line-height:1.5}
.limits > b{color:var(--ink);display:block;margin-bottom:3px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.limits ul{margin:0;padding-left:17px}

/* evidence checks */
.checks{list-style:none;margin:0;padding:0}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.checks li:first-child{border-top:0;padding-top:2px}
.checks .st{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;margin-top:1px}
.st.pass{background:var(--blue)} .st.fail{background:var(--red)} .st.inc{background:#fff;color:var(--amber);border:2px dashed var(--amber)} .st.na{background:#c9ced8}
.checks .nm{font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.checks .rs{grid-column:2;font-size:12.5px;color:var(--ink2);line-height:1.45}
.chkfoot{font-size:12px;color:var(--blue);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}

/* four status tracks */
.tracks{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff}
.track{display:grid;grid-template-columns:6px 130px 1fr auto;align-items:center;gap:12px;padding:12px 14px 12px 0;border-top:1px solid var(--line)}
.track:first-child{border-top:0}
.track .bar{height:100%;min-height:38px}
.track .t{font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.track .s{font-size:14px;font-weight:600}
.track .d{font-size:12.5px;color:var(--ink2);font-weight:400;margin-top:2px}
.tr-blue .bar{background:var(--blue)} .tr-blue .t{color:var(--blue)}
.tr-violet .bar{background:var(--violet)} .tr-violet .t{color:var(--violet)}
.tr-green .bar{background:var(--green)} .tr-green .t{color:var(--green)}
.tr-teal .bar{background:var(--teal)} .tr-teal .t{color:var(--teal)}
.track.idle .bar{background:#d5d9e0} .track.idle .s{color:var(--ink3)}

/* transport */
.tabs{display:flex;border-bottom:1px solid var(--line);margin:-4px 0 14px;gap:4px}
.tabs span{padding:8px 12px;font-size:13.5px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs span.on{color:var(--ink);border-color:var(--ink)}
.tabs span.off{color:#b5bac4;text-decoration:line-through}
.qrwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.qrwrap svg{width:250px;height:250px;background:#fff;padding:10px;border:1px solid var(--line);border-radius:10px}
.frames{font-size:12.5px;color:var(--ink2)}
.progress{height:8px;background:var(--gray-bg);border-radius:99px;overflow:hidden;width:100%}
.progress i{display:block;height:100%;background:var(--ink)}
.camera{aspect-ratio:4/3;background:#23272f;border-radius:10px;position:relative;display:grid;place-items:center;color:#9aa1ae;font-size:13px;overflow:hidden}
.camera .reticle{width:58%;aspect-ratio:1;border:2px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.camera .cap{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#fff;font-size:12.5px}
.drop{border:2px dashed #c3c8d2;border-radius:10px;padding:22px;text-align:center;font-size:13.5px;color:var(--ink2);background:#fff}

/* checklist */
.cl{list-style:none;margin:0;padding:0}
.cl li{display:grid;grid-template-columns:24px 1fr auto;gap:2px 10px;padding:11px 0;border-top:1px solid var(--line);align-items:start}
.cl li:first-child{border-top:0}
.cl .t{font-size:14px;font-weight:600}
.cl .r{grid-column:2/4;font-size:12.5px;color:var(--ink2)}
.ok{color:var(--green);font-weight:700} .no{color:var(--amber);font-weight:700} .run{color:var(--ink3)}
.cl .tag{font-size:11.5px}

/* steps */
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:26px 1fr auto;gap:2px 10px;padding:9px 0;align-items:center;font-size:13.5px}
.steps .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--gray-bg);color:var(--ink3)}
.steps .done .n{background:var(--ink);color:#fff}
.steps .now .n{background:#fff;border:2px solid var(--ink);color:var(--ink)}
.steps .now{font-weight:600}
.steps .r{grid-column:2/4;font-size:12px;color:var(--ink3)}

table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-weight:600;color:var(--ink3);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.ticket{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.ticket:first-of-type{border-top:0}
.ticket .tt{font-weight:600;font-size:14px}
.ticket .chips{grid-column:1/3;display:flex;gap:6px;flex-wrap:wrap}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.role{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.role b{display:block;font-size:14.5px;margin-bottom:4px}
.role span{font-size:12.5px;color:var(--ink2)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.callout{background:#fff8e8;border:1px solid #f1dcae;border-radius:8px;padding:10px 12px;font-size:13px;color:#5b3d00;line-height:1.45}
.callout.info{background:#eef3fe;border-color:#cfdcfa;color:#1d3c8f}
.fp{font-family:ui-monospace,Menlo,monospace;font-size:15px;letter-spacing:.06em;background:var(--gray-bg);padding:8px 10px;border-radius:7px;display:inline-block}
.sizes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.size{background:var(--gray-bg);border-radius:8px;padding:10px}
.size .k{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.size .v{font-size:18px;font-weight:700}
.size .e{font-size:11.5px;color:var(--ink3)}
.drawer{position:absolute;top:37px;right:0;bottom:0;width:min(560px,100%);background:#fff;border-left:1px solid var(--line);box-shadow:-12px 0 30px rgba(0,0,0,.08);padding:18px;overflow:auto;z-index:4}
.scrim{position:absolute;inset:37px 0 0 0;background:rgba(20,23,28,.25);z-index:3}

/* ---------- phone (container query) ---------- */
@container (max-width: 600px){
  .strip{font-size:11.5px;min-height:34px}
  .strip > div:not(.conn):not(.compact-keep){display:none}
  .strip-compact{display:flex !important;flex:1;justify-content:space-between}
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .content{padding:14px 14px 110px}
  .head h1{font-size:19px}
  .cols,.pair,.roles,.sizes{grid-template-columns:1fr}
  .track{grid-template-columns:5px 1fr;row-gap:2px}
  .track > div:nth-child(3){grid-column:2}
  .track > div:nth-child(4){grid-column:2}
  .actions.sticky{position:sticky;bottom:0;z-index:2;padding:10px 0 12px;background:rgba(255,255,255,.97);border-top:1px solid var(--line)}
  .actions.sticky .btn{flex:1;justify-content:center}
  .qrwrap svg{width:min(330px,100%);height:auto;aspect-ratio:1}
  .evidence-phone summary{display:list-item}
  .verdict{padding:14px}
  .verdict h2{font-size:17px}
  .drawer{top:34px}
  .hide-phone{display:none}
  table.t .hide-phone{display:none}
}
.evidence-phone summary{display:none;cursor:default;font-weight:600;font-size:14px;margin-bottom:8px}
@container (min-width: 601px){ .evidence-phone > summary{display:none} .show-phone{display:none} }
</style>
<link rel="stylesheet" href="counterfoil.css">
</head>
<body>
<nav id="index"></nav>
<section id="stage">
  <div id="stagebar">
    <button id="review-toggle" aria-expanded="false" class="review-toggle">Design screens</button>
    <h2 id="stitle"></h2>
    <span class="note" id="snote"></span>
    <div class="seg" id="viewseg"><button data-v="both" class="on">Both</button><button data-v="laptop">Laptop</button><button data-v="phone">Phone</button></div>
  </div>
  <div id="frames">
    <div class="device lp"><span class="lbl">Laptop · 1020 px</span><div class="laptop"><div class="screen" id="lp"></div></div></div>
    <div class="device ph"><span class="lbl">Phone · 366 px</span><div class="phone"><div class="screen" id="ph"></div></div></div>
  </div>
</section>

<script src="counterfoil-demo.js"></script>
<script>
/* ================= helpers ================= */
const VENUE_ID = '03a1c8…9f2c';
function qr(seed, size=29){
  let s = 0; for (const c of seed) s = (s*31 + c.charCodeAt(0)) >>> 0;
  const rnd = () => (s = (s*1664525 + 1013904223) >>> 0) / 4294967296;
  let r = '';
  const finder = (x,y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  const inF = (x,y) => (x<8&&y<8)||(x>size-9&&y<8)||(x<8&&y>size-9);
  for (let y=0;y<size;y++) for (let x=0;x<size;x++) if(!inF(x,y) && rnd()>.52) r += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  return `<svg viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges">${r}${finder(0,0)}${finder(size-7,0)}${finder(0,size-7)}</svg>`;
}
const strip = (o={}) => o.scanner?`<div class="strip"><div>Offline · sample</div><div>External requests <b>0 this check</b></div><div>Headers <b>${o.scannerHeight||(scannerDemo.scenario==='missing'?'1,712,388':'1,712,402')}</b> · sample</div><div class="fill"></div><a class="sub" href="#log">Network log ›</a></div>`:o.preparation?`<div class="strip"><div>${preparationDemo.scenario==='offline'?'Offline':'Online'} · sample</div><div>External sync requests <b>${preparationDemo.activity.filter(e=>e[0]!=='Local wallet bridge').length}</b></div><div>Headers <b>${preparationDemo.stage==='done'?'1,712,402':'1,712,388'}</b> · sample</div><div class="fill"></div><a class="sub" href="#log">Network log ›</a></div>`:`<div class="strip"><div>${o.online?'Online':'Offline'} · sample</div><div>External requests <b>0 this check</b></div><div>Headers <b>1,712,388</b> · sample snapshot</div><div class="fill"></div><a class="sub" href="#log">Network log ›</a></div>`;
let workspace = 'holder';
let collectionHasDemoTickets=false;
const rail = (active) => {
  const items = workspace === 'venue'
    ? [['venue','Issue ticket','/venue'],['prep','Prepare offline','p1'],['hdr','Headers','h1']]
    : workspace === 'scanner'
    ? [['door','Scan ticket','/scanner'],['prep','Prepare offline','p1'],['hdr','Headers','h1']]
    : [['home','My tickets','/tickets'],['buyer','Receive ticket','b1'],['seller','Transfer ticket','s1'],['prep','Prepare offline','p1'],['hdr','Headers','h1']];
  const label = workspace === 'venue' ? 'VENUE WORKSPACE' : workspace === 'scanner' ? 'SCANNER WORKSPACE' : 'YOUR TICKET COLLECTION';
  return `<nav class="rail" aria-label="${label}"><div class="brand">Counterfoil.<span>${label}<br>BSV / TESTNET CONCEPT</span></div>${
    items.map(([key,label,route]) => `<a href="#${route}" class="${key===active?'on':''}">${label}</a>`).join('')}<div class="rail-note">The proof travels<br>with the ticket.</div></nav>`;
};
const head = (crumb, title, badges='') => `<div class="head"><div class="grow"><div class="crumb">${crumb}</div><h1>${title}</h1></div>${badges}</div>`;
const page = (o, body) => `<div class="proto-label"><span>Design prototype · all values illustrative</span><span>No wallet connected / Testnet concept</span></div>${strip(o.strip)}<div class="shell">${rail(o.rail)}<main class="content">${head(o.crumb,o.title,o.badges||'')}${body}</main></div>${o.overlay||''}`;
const verdict = (tone, ic, title, sub) => `<div class="verdict v-${tone}"><div class="ic">${ic}</div><div><h2>${title}</h2><p>${sub}</p></div></div>`;
const limits = (title, items) => `<div class="limits"><b>${title}</b><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
const btn = (t, cls='', dis=false) => `<button class="btn ${cls}" ${dis?'disabled':''}>${t}</button>`;
const sym = {pass:'✓', fail:'✕', inc:'?', na:'–'};
const CHECK_NAMES = {issuer:'Issuer', continuity:'Ticket continuity', transaction:'Transaction evidence', anchors:'Anchor block(s)', recipient:'Recipient locking key'};
const checks = (list, foot) => `<div class="card"><h3>Evidence <span class="muted">· checked on this device</span></h3><ul class="checks">${

 </section>
 <section class="landing-offline"><div><span class="section-label">03 / KNOW WHAT OFFLINE MEANS</span><h2>No connection<br><em>at the handoff.</em></h2><p>Prepare the app, wallet and required headers while online. Then exchange and check the package without contacting a ticketing server.</p></div><div class="offline-receipt"><span class="receipt-caption">THE IMPORTANT DISTINCTION</span><div><b>Verified offline</b><span>Evidence checked locally</span></div><div><b>Pending broadcast</b><span>Transfer still needs submission</span></div><p>Offline verification cannot rule out a double-sale or prove that a ticket is currently unspent. Mining and wallet import are tracked separately.</p><small>Sending files remotely needs a connection. A downloaded package can be checked offline.</small></div></section>

 const scenario=id==='d1'?'pass':id==='d2'?'unmined':id==='d3'?(scannerDemo.scenario==='proof'?'proof':'missing'):(scannerDemo.scenario==='issuer'?'issuer':'tampered');
 const definitions={
 pass:['green','✓','Passes POC policy','The latest presented transfer is mined and the required evidence checks passed.'],
 unmined:['amber','!','Online check required','The latest transfer is unmined. Valid mined ancestors do not confirm this transfer.'],
 missing:['amber','?','Verification incomplete','Block header 1,712,402 is missing from the local snapshot.'],
 proof:['amber','?','Verification incomplete','The package does not contain a mining proof for the latest transfer. Its confirmation cannot be established offline.'],
 tampered:['red','×','Ticket rejected','Ticket data was altered and its integrity check failed.'],
 issuer:['red','×','Ticket rejected','The issuer signature does not match the pinned venue key.']
 };
 const [tone,icon,title,reason]=definitions[scenario];
 let rows=[['Venue signature','Passed — trusted issuer'],['Ticket continuity','Passed — links to issuance'],['Transaction evidence','Passed locally'],['Latest-transfer inclusion','Passed — block 1,712,402']];
 if(scenario==='unmined')rows[3][1]='Not mined — online check required';
 if(scenario==='missing')rows[3][1]='Incomplete — required header missing';
 if(scenario==='proof')rows[3][1]='Incomplete — mining proof missing';
 if(scenario==='tampered')rows=[['Package integrity','Failed — altered ticket data'],['Venue signature','Not evaluated'],['Ticket continuity','Not evaluated'],['Latest-transfer inclusion','Not evaluated']];
 if(scenario==='issuer')rows=[['Venue signature','Failed — wrong signing key'],['Ticket continuity','Not evaluated'],['Transaction evidence','Not evaluated'],['Latest-transfer inclusion','Not evaluated']];
 const recovery=scenario==='missing'?'Keep the package, reconnect to sync the required header, then retry.':scenario==='proof'?'Ask the holder for an updated package with the latest-transfer mining proof, or perform an online check.':scenario==='unmined'?'Hold the offline admission decision. Reconnect to check the transfer status; retry when mining evidence is available.':scenario==='pass'?'This sample meets the POC’s mined-transfer rule. This preview does not record admission.':'Do not accept this package. Ask the holder for a valid ticket package.';
 return page({rail:'door',strip:{scanner:true,scannerHeight:scenario==='missing'?'1,712,388':'1,712,402'},crumb:'SCANNER RESULT / DEMO DATA',title},`<div class="receive-flow">${verdict(tone,icon,title,reason)}<div class="request-layout"><section class="card"><span class="home-eyebrow">PRESENTED TICKET / SAMPLE</span><h3 class="prep-title">Harbour Nights.</h3>${demoFacts([['Ticket','GA-0142'],['Latest transfer','e91b…07'],['External requests','0 during local verification']])}<p>${recovery}</p><div class="actions">${scannerButton('Scan next ticket ↗','next')}${scenario==='missing'?demoLink('Prepare & sync','prep'):''}${['unmined','proof'].includes(scenario)?demoLink('Review preparation','prep'):''}</div><p class="small muted">All values are sample data. No live admission decision was made.</p></section><section class="card"><h3>Evidence results</h3><ul class="checks">${rows.map(([name,value])=>`<li><span class="st ${value.startsWith('Passed')?'pass':value.startsWith('Failed')?'fail':'inc'}">${value.startsWith('Passed')?'✓':value.startsWith('Failed')?'×':'—'}</span><div class="nm">${name}</div><div class="rs">${value}</div></li>`).join('')}</ul>${scannerLimits()}</section></div></div>`);
}

 const submitted=doubleSellDemo['submitted'+id],resolved=online&&doubleSellDemo.resolved,won=resolved&&doubleSellDemo.winner===id;

y.</p></div><div class="card"><span class="badge b-amber">Buyer ${doubleSellDemo.winner==='A'?'B':'A'} · online check required</span><h3>No mined latest transfer.</h3><p>The offline scanner cannot infer the competing spend. It flags this package for an online check; the demonstrated online conflict evidence supports rejection.</p></div></div><p class="small muted">A mined inclusion proof still does not prove current unspentness or prevent repeated entry. No real admission is recorded.</p></section>`:''}</div>`);

 const beforeBytes=PROOF_SIZE_DEMO.before[metric],afterBytes=PROOF_SIZE_DEMO.after[metric],saved=beforeBytes-afterBytes;
 const bytes=n=>n.toLocaleString('en-US')+' B';
 const retained=[['Venue signature','Keep the issuer’s signature and the trusted-key reference needed to check authenticity.'],['Issuance evidence','Keep the original ticket identity and issuance reference required by the ticket format.'],['Transfer continuity','Keep the ticket lineage needed to link the current transfer to the issued ticket.'],['Current transfer','Keep its transaction and recipient-locking evidence.'],['Mining evidence','Use the relevant Merkle proof and a separately stored validated block header.']];
 return page({rail:'home',crumb:'PROOF SIZE / DEMO DATA',title:'Less history to carry.'},`<div class="receive-flow"><div class="home-intro"><p>The proof changes.<br>The ticket’s identity stays.</p></div><div class="buyer-scenarios"><span>ILLUSTRATIVE BYTE COUNTS / NOT LIVE MEASUREMENTS</span><div class="request-methods" role="group" aria-label="Transfer stage"><button data-proof-stage="before" aria-pressed="${!after}">Before mining</button><button data-proof-stage="after" aria-pressed="${after}">After mining</button></div></div><div class="request-layout"><section class="proof-package"><span class="home-eyebrow">HARBOUR NIGHTS / GA-0142 / SAMPLE</span><h2>${after?'Anchored in<br><em>a block.</em>':'Carrying its<br><em>ancestry.</em>'}</h2><span class="badge ${after?'b-green':'b-amber'}">${after?'Latest transfer mined · example':'Latest transfer unmined · example'}</span><ol class="proof-layers"><li><span>01</span><div><b>Current transfer</b><small>Transaction and buyer’s locking output</small></div></li><li class="proof-changing"><span>02</span><div><b>${after?'Merkle inclusion proof':'Required transaction ancestry'}</b><small>${after?'Relevant BUMP anchors the mined transaction to a stored block header.':'Required ancestors connect the unmined transfer to mined anchors.'}</small></div></li><li><span>03</span><div><b>Ticket authenticity & continuity</b><small>Retained independently of SPV ancestry pruning</small></div></li></ol><p class="small muted">${after?'Once the mining proof is verified, ancestry no longer required for SPV can be omitted. Keep any evidence still needed by the ticket rules.':'Before mining, the package must provide the transaction evidence required to verify the unmined chain.'}</p></section><section class="request-aside"><span class="home-eyebrow">BEFORE / AFTER</span><h3>Measure both sizes.</h3><div class="request-methods" role="group" aria-label="Size measurement"><button data-proof-metric="package" aria-pressed="${metric==='package'}">Total package</button><button data-proof-metric="beef" aria-pressed="${metric==='beef'}">Atomic BEEF</button></div><div class="proof-measure" aria-live="polite"><div class="proof-bar-label"><b>Before mining</b><span>${bytes(beforeBytes)}</span></div><div class="proof-bar"><i style="width:100%"></i></div><div class="proof-bar-label"><b>After mining</b><span>${bytes(afterBytes)}</span></div><div class="proof-bar after"><i style="width:${afterBytes/beforeBytes*100}%"></i></div><p><strong>${(saved/beforeBytes*100).toFixed(1)}%</strong> smaller in this example<br><span>${bytes(saved)} fewer bytes</span></p></div><p class="small muted">Total package includes Atomic BEEF plus the ticket envelope and retained ticket evidence. Block headers are stored separately on the device.</p></section></div><section class="card proof-size-table"><h3>The complete comparison</h3><table class="t"><thead><tr><th>Measurement</th><th>Before mining</th><th>After mining</th></tr></thead><tbody><tr><td>Atomic BEEF</td><td>${bytes(PROOF_SIZE_DEMO.before.beef)}</td><td>${bytes(PROOF_SIZE_DEMO.after.beef)}</td></tr><tr><td>Total package</td><td>${bytes(PROOF_SIZE_DEMO.before.package)}</td><td>${bytes(PROOF_SIZE_DEMO.after.package)}</td></tr></tbody></table><p class="small muted">These are design fixtures. The working app must measure the actual serialized bytes before and after pruning. A smaller total package is not guaranteed for every transfer.</p></section><section class="landing-evidence proof-retained"><span class="home-eyebrow">WHAT MUST STILL BE AVAILABLE</span><h2>Smaller doesn’t mean<br><em>less evidence of authenticity.</em></h2><div class="evidence-folds">${retained.map(([name,text],i)=>`<details><summary><span>0${i+1}</span>${name}<i aria-hidden="true">+</i></summary><div><p>${text}</p></div></details>`).join('')}</div></section><div class="request-notice"><b>Prune, then verify again.</b><p>The reduced package must still pass the issuer, continuity, transaction and recipient checks, with SPV anchors checked against stored headers. Mined inclusion does not prove current unspentness.</p><p class="small muted">This screen does not prune a real package or run verification.</p></div><div class="actions">${demoLink('Review accepted ticket','b6')}${demoLink('Double-sell demonstration','x1')}${demoLink('My tickets','home')}</div></div>`);
}

function show(id){
  const aliases={'p1':'prep','h1':'hdr','n1':'log','/':'landing','/tickets':collectionHasDemoTickets?'home':'home-empty','/venue':'v1','/scanner':'d0'};
  id=aliases[id]||id||'landing';
  if(id==='home'||id==='b6')collectionHasDemoTickets=true;
  if(id==='home-empty')collectionHasDemoTickets=false;
  if(id.startsWith('v')) workspace='venue';
  else if(id.startsWith('d')) workspace='scanner';
  else if(['landing','home','home-empty','f1','x1','x2','z1'].includes(id)||/^b\d|^s\d/.test(id)) workspace='holder';
  const s = S.find(x=>x.id===id) || S[0];
  document.getElementById('lp').innerHTML = s.render();
  document.getElementById('ph').innerHTML = s.render();
  document.getElementById('stitle').textContent = s.name;
  document.getElementById('snote').textContent = s.note;
  idx.querySelectorAll('a').forEach(a=>a.classList.toggle('on', a.getAttribute('href')==='#'+s.id));
  decorate(s.id);
  document.querySelectorAll('.landing').forEach(el=>el.classList.toggle('motion-paused',window.matchMedia('(prefers-reduced-motion: reduce)').matches));
  document.querySelectorAll('.screen').forEach(e=>e.scrollTop=0);
}

function decorate(id){

 const form=e.target;
 for(const name of ['event','ticket']){const input=form.elements.namedItem(name);input.setCustomValidity(input.value.trim()?'':'Enter a value.');if(!input.checkValidity()){input.reportValidity();return;}}
 venueDemo.event=form.elements.namedItem('event').value.trim();venueDemo.ticket=form.elements.namedItem('ticket').value.trim();venueDemo.recipient=form.elements.namedItem('recipient').value;venueDemo.stage='review';show('v1');
});
document.addEventListener('input',e=>{if(e.target.closest('[data-venue-form]')&&e.target.setCustomValidity)e.target.setCustomValidity('');});
document.addEventListener('change',e=>{if(e.target.matches('[data-double-winner]')&&!doubleSellDemo.resolved){doubleSellDemo.winner=e.target.value;}});
document.addEventListener('click',e=>{
 const fake=e.target.closest('[data-fake]');if(fake){scannerDemo.scenario=fake.dataset.fake;location.hash='d4';return;}

 const proofControl=e.target.closest('[data-proof-stage],[data-proof-metric]');
 if(proofControl){if(proofControl.dataset.proofStage)proofSizeDemo.stage=proofControl.dataset.proofStage;if(proofControl.dataset.proofMetric)proofSizeDemo.metric=proofControl.dataset.proofMetric;const position=[...document.querySelectorAll('.screen')].map(el=>el.scrollTop);show('z1');document.querySelectorAll('.screen').forEach((el,i)=>el.scrollTop=position[i]);const selector=proofControl.hasAttribute('data-proof-stage')?'[data-proof-stage="'+proofSizeDemo.stage+'"]':'[data-proof-metric="'+proofSizeDemo.metric+'"]';document.querySelectorAll(selector).forEach(el=>{if(el.offsetWidth)el.focus({preventScroll:true});});return;}

 const doubleControl=e.target.closest('[data-double]');
 if(doubleControl){
  if(doubleControl.disabled)return;const action=doubleControl.dataset.double;
  const go=id=>{if(location.hash==='#'+id)show(id);else location.hash=id;};
  if(action==='restart'){doubleSellDemo={verified:false,submittedA:false,submittedB:false,winner:'A',resolved:false,scanner:false};go('x1');return;}
  if(action==='verify'){doubleSellDemo.verified=true;show('x1');return;}
  if(action==='online'){if(doubleSellDemo.verified)go('x2');return;}
  if(action==='submit-A'||action==='submit-B'){doubleSellDemo['submitted'+action.slice(-1)]=true;show('x2');return;}
  if(action==='resolve'){if(doubleSellDemo.submittedA&&doubleSellDemo.submittedB){doubleSellDemo.resolved=true;show('x2');}return;}
  if(action==='scanner'){if(doubleSellDemo.resolved){doubleSellDemo.scanner=true;show('x2');document.querySelectorAll('.double-scanner').forEach(el=>{if(el.offsetWidth)el.scrollIntoView({block:'start'});});}return;}
 }

 const venueControl=e.target.closest('[data-venue]');
 if(venueControl){
  if(venueControl.disabled)return;const action=venueControl.dataset.venue;
  const go=id=>{if(location.hash==='#'+id)show(id);else location.hash=id;};
  if(action==='connect'||action==='wrong-wallet'){const form=venueControl.closest('.request-share').querySelector('form');if(form){venueDemo.event=form.elements.namedItem('event').value;venueDemo.ticket=form.elements.namedItem('ticket').value;}venueDemo.wallet=action==='connect'?'matched':'wrong';venueDemo.stage='details';show('v1');return;}
  if(action==='edit'){venueDemo.stage='details';go('v1');return;}
  if(action==='authorize'||action==='retry-sign'){if(venueDemo.wallet!=='matched')return;venueDemo.signing='waiting';go('v2');return;}
  if(action==='cancel-sign'){venueDemo.signing='cancelled';show('v2');return;}
  if(action==='signed'){if(venueDemo.wallet!=='matched')return;venueDemo.broadcast='not-submitted';venueDemo.mining='pending';go('v3');return;}
  if(action==='broadcast'||action==='broadcast-fail'){venueDemo.broadcast=action==='broadcast'?'submitted':'failed';show('v3');return;}
  if(action==='mined'){if(venueDemo.broadcast==='submitted'){venueDemo.mining='mined';show('v3');}return;}
  if(action==='new'){venueDemo={wallet:venueDemo.wallet,stage:'details',event:venueDemo.event,ticket:'',recipient:'R-4F2A',signing:'waiting',broadcast:'not-submitted',mining:'pending'};go('v1');return;}
 }

 const scannerControl=e.target.closest('[data-scanner]');
 if(scannerControl){
  const action=scannerControl.dataset.scanner;
  if(action==='verify'){location.hash=scannerDemo.scenario==='pass'?'d1':scannerDemo.scenario==='unmined'?'d2':['missing','proof'].includes(scannerDemo.scenario)?'d3':'d4';return;}
  if(action==='next'){scannerDemo={method:'qr',stage:'idle',scenario:'pass'};location.hash='d0';return;}
  if(action==='qr'||action==='file'){scannerDemo.method=action;scannerDemo.stage='idle';}
  else scannerDemo.stage=action==='load'?'loading':action==='complete'?'ready':action==='reset'?'idle':action;
  show('d0');return;
 }

 const preparationButton=e.target.closest('[data-preparation]');
 if(preparationButton){
  const action=preparationButton.dataset.preparation;
  if(action==='start'){
   if(preparationDemo.scenario==='offline'){preparationDemo.stage='error';}
   else if(preparationDemo.scenario==='wallet'){preparationDemo.activity.push(['Local wallet bridge','Access check','Unavailable']);preparationDemo.stage='error';}
   else {preparationDemo.activity.push(['Header source A','Header sync','Pending'],['Header source B','Cross-check','Pending']);preparationDemo.stage='syncing';}
  }else if(action==='finish'){
   const result=preparationDemo.scenario==='conflict'?'Source disagreement':preparationDemo.scenario==='missing'?'Required header unavailable':'Validated';
   preparationDemo.activity.slice(-2).forEach(entry=>entry[2]=result);
   preparationDemo.stage=preparationDemo.scenario==='ready'?'done':'error';
  }else if(action==='cancel'){preparationDemo.activity.slice(-2).forEach(entry=>entry[2]='Cancelled');preparationDemo.stage='idle';}
  show('prep');return;
 }

 const sellerControl=e.target.closest('[data-seller]');
 if(sellerControl){
  const action=sellerControl.dataset.seller;if(sellerControl.disabled)return;
  const go=id=>{if(location.hash==='#'+id)show(id);else location.hash=id;};
  if(action==='check'){sellerDemo.checked=true;show('s1');return;}
  if(action==='request'){if(sellerDemo.checked){sellerDemo.importState='idle';go('s2');}return;}
  if(['qr','file','reset-import','camera-error'].includes(action)){sellerDemo.confirmed=false;sellerDemo.importState=action==='camera-error'?'camera-error':'idle';if(action==='qr'||action==='file')sellerDemo.method=action;go('s2');return;}
  if(action==='import'){sellerDemo.confirmed=false;if(sellerDemo.request==='valid')go('s3');else{sellerDemo.importState='error';show('s2');}return;}
  if(action==='authorize'){if(sellerDemo.confirmed){sellerDemo.wallet='waiting';go('s4');}return;}
  if(action==='recipient'){go('s3');return;}
  if(['cancel-wallet','fail-wallet','retry-wallet'].includes(action)){sellerDemo.wallet=action==='cancel-wallet'?'cancelled':action==='fail-wallet'?'failed':'waiting';show('s4');return;}
  if(action==='signed'){sellerDemo.share='qr';go('s5');return;}
  if(action==='share-qr'||action==='share-file'){sellerDemo.share=action==='share-qr'?'qr':'file';show(location.hash.slice(1)==='s5f'?'s5f':'s5');return;}
  if(action==='download'){const data={designPreview:true,validTransaction:false,note:'Illustrative package only. No signed transaction or cryptographic proof.',ticket:'GA-0142',request:'R-4F2A'};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='ticket-package-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;}
 }

 const buyerButton=e.target.closest('[data-buyer]');
 if(buyerButton){
  const action=buyerButton.dataset.buyer;
  if(action==='accept'){location.hash='b6';return;}
  if(action==='decline'){const root=buyerButton.closest('.card');root.querySelector('[data-buyer-notice]').textContent='Package declined in this preview. No ticket was accepted.';root.querySelector('[data-buyer="accept"]').disabled=true;buyerButton.disabled=true;return;}
  if(action==='retry'){buyerDemo.outcome='pass';location.hash='b3';return;}
  if(action==='verify'){location.hash=buyerDemo.outcome==='pass'?'b3':buyerDemo.outcome==='missing'?'b4':'b5';return;}
  if(action==='qr'||action==='file'){buyerDemo.method=action;buyerDemo.stage='idle';}
  else buyerDemo.stage=action==='load'?'loading':action==='complete'?'ready':action==='reset'?'idle':action;
  show('b2');
  document.querySelectorAll('.screen').forEach(screen=>{const target=screen.querySelector('.buyer-transport button');if(target&&screen.clientWidth)target.focus({preventScroll:true});});
  return;
 }

 const create=e.target.closest('[data-request-create]');
 if(create){const root=create.closest('.receive-flow');root.querySelector('.request-start').hidden=true;root.querySelector('.request-ready').hidden=false;root.querySelector('[data-request-method]').focus();return;}
 const method=e.target.closest('[data-request-method]');
 if(method){const root=method.closest('.request-share');root.querySelectorAll('[data-request-method]').forEach(b=>b.setAttribute('aria-pressed',String(b===method)));root.querySelectorAll('[data-request-panel]').forEach(p=>p.hidden=p.dataset.requestPanel!==method.dataset.requestMethod);return;}
 if(e.target.closest('[data-request-download]')){const data={designPreview:true,validWalletRequest:false,displayRequestId:'R-4F2A',note:'Illustrative artifact only. No receiving key or signature.'};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='receiving-request-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;}

 const journeyButton=e.target.closest('[data-journey], [data-journey-next]');
 if(journeyButton){
  const root=journeyButton.closest('.journey');
  const step=journeyButton.hasAttribute('data-journey')?Number(journeyButton.dataset.journey):(Number(root.dataset.step)+1)%3;
  const scenes=[
   ['SELLER / PREPARED OFFLINE','Make the transfer for this buyer.','The buyer shares a receiving request. The seller checks the ticket’s evidence locally, then uses their wallet to sign a transfer to the buyer’s key. The package goes back by QR or file.','Both devices were prepared online before the handoff.','Next: Buyer →'],
   ['BUYER / VERIFIED OFFLINE — PENDING BROADCAST','Check the evidence. Save the package.','The buyer checks the venue signature, transfer history, block proofs and that the output is locked to their key. Accept saves the package locally, ready to reopen.','This cannot rule out a double-sale. Reconnect to broadcast; mining is a separate step.','Next: Scanner →'],
   ['SCANNER / LATER, AFTER MINING & PREPARATION','Check the latest transfer at the entrance.','For this scene, the transfer has been broadcast and mined, and the package and scanner headers have been updated. The offline scanner checks the issuer, ticket history and latest-transfer inclusion proof.','Unmined or missing evidence needs an online check. Mined inclusion alone does not prove current unspentness or prevent repeated entry.','Replay: Seller ↺']
  ];
  root.dataset.step=String(step);
  root.querySelectorAll('[data-journey]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.journey)===step)));
  const scene=scenes[step],description=root.querySelector('.journey-description');
  ['span','h3','p','small'].forEach((tag,i)=>description.querySelector(tag).textContent=scene[i]);
  root.querySelector('[data-journey-next]').textContent=scene[4];
  return;
 }
 const motion=e.target.closest('.motion-toggle');
 if(motion){const root=motion.closest('.landing');const paused=root.classList.toggle('motion-paused');motion.setAttribute('aria-pressed',String(paused));motion.textContent=paused?'Play motion ▷':'Pause motion Ⅱ';return;}
 const jump=e.target.closest('[data-scroll]');
 if(jump){jump.closest('.landing').querySelector('[data-section="how"]').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});return;}
 const b=e.target.closest('.btn');if(!b||b.disabled||b.tagName==='A'||(b.type==='submit'&&b.closest('form')))return;
 const label=b.textContent.trim(); const current=location.hash.slice(1)||'home';
 const routes={'Accept':'b6','Accept ticket':'b6','Reject':'b5','Scan next':'d0','Create receiving request':'b1','Prepare for offline use':'p1'};
 if(routes[label]){location.hash=routes[label];return;}
 if(/scan/i.test(label)){location.hash=current.startsWith('s')?'s2':'b2';return;}
 if(/authorize|sign transfer/i.test(label)){location.hash='s5';return;}
 toast('Design preview only — '+label+'. No wallet action or network transaction was performed.');
});
document.getElementById('frames').className='only-laptop';
document.querySelectorAll('#viewseg button').forEach(b=>b.classList.toggle('on',b.dataset.v==='laptop'));
document.getElementById('review-toggle').addEventListener('click',e=>{
 const open=document.body.classList.toggle('review-open');
 e.currentTarget.setAttribute('aria-expanded',String(open));
});

</script>
</body>
</html>
